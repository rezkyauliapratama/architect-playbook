version: '3.8'

networks:
  docker_network:
    driver: bridge

volumes:
  redpanda-0: null
  redpanda-1: null
  redpanda-2: null
  postgres_data: null

services:
  redpanda-0:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.5
    container_name: redpanda-0
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda-0:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda-0:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda-0:33145
      - --advertise-rpc-addr=redpanda-0:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    volumes:
      - redpanda-0:/var/lib/redpanda/data
    networks:
      - docker_network
    ports:
      - "18081:18081"
      - "18082:18082"
      - "19092:19092"
      - "19644:9644"

  redpanda-1:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.5
    container_name: redpanda-1
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr=internal://redpanda-1:9092,external://localhost:29092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:28082
      - --advertise-pandaproxy-addr=internal://redpanda-1:8082,external://localhost:28082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:28081
      - --rpc-addr=redpanda-1:33145
      - --advertise-rpc-addr=redpanda-1:33145
      - --seeds=redpanda-0:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    volumes:
      - redpanda-1:/var/lib/redpanda/data
    networks:
      - docker_network
    ports:
      - "28081:28081"
      - "28082:28082"
      - "29092:29092"
      - "29644:9644"
    depends_on:
      - redpanda-0

  redpanda-2:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.5
    container_name: redpanda-2
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:39092
      - --advertise-kafka-addr=internal://redpanda-2:9092,external://localhost:39092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:38082
      - --advertise-pandaproxy-addr=internal://redpanda-2:8082,external://localhost:38082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:38081
      - --rpc-addr=redpanda-2:33145
      - --advertise-rpc-addr=redpanda-2:33145
      - --seeds=redpanda-0:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    volumes:
      - redpanda-2:/var/lib/redpanda/data
    networks:
      - docker_network
    ports:
      - "38081:38081"
      - "38082:38082"
      - "39092:39092"
      - "39644:9644"
    depends_on:
      - redpanda-0

  console:
    image: docker.redpanda.com/redpandadata/console:v2.8.1
    container_name: redpanda-console
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: 
            - "redpanda-0:9092"
            - "redpanda-1:9092"
            - "redpanda-2:9092"
          schemaRegistry:
            enabled: true
            urls: ["http://redpanda-0:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: 
              - "http://redpanda-0:9644"
              - "http://redpanda-1:9644"
              - "http://redpanda-2:9644"
    ports:
      - "8080:8080"
    networks:
      - docker_network
    depends_on:
      - redpanda-0
      - redpanda-1
      - redpanda-2

  postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - docker_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    build: ./baseline/producer
    container_name: order-service
    environment:
      KAFKA_BROKERS: "redpanda-0:9092,redpanda-1:9092,redpanda-2:9092"
      SERVICE_PORT: "8081"
    ports:
      - "8081:8081"
    networks:
      - docker_network
    depends_on:
      - redpanda-0
      - redpanda-1
      - redpanda-2
    restart: unless-stopped

  inventory-service:
    build: ./baseline/consumer
    # container_name: inventory-service
    environment:
      KAFKA_BROKERS: "redpanda-0:9092,redpanda-1:9092,redpanda-2:9092"
      KAFKA_GROUP_ID: "inventory-consumer-group"
      HOSTNAME: "inventory-1"
      DB_HOST: "postgres"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_NAME: "inventory_db"
    deploy:
      replicas: 3
    networks:
      - docker_network
    depends_on:
      - redpanda-0
      - redpanda-1
      - redpanda-2
      - postgres
    restart: unless-stopped